name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1   # production runs Node 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: for f in $(find server public/js test -name '*.js'); do node --check "$f"; done
      - run: npm test
      # Codes' service manifest, its capabilities and codes.app-manifest@1 are proposals (docs/) until
      # the lead releases them in openvibe-contracts; until then the check reports the placeholder
      # manifest's range and the unreleased contract, so it does not fail the build.
      - run: npx openvibe-contracts-check --service codes --src server
        continue-on-error: true
