name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1   # production runs Node 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: for f in $(find server public/js test -name '*.js'); do node --check "$f"; done
      - run: npm test
      # Blocking: the codes manifest, codes.release.manage|read and codes.app-manifest@1 are released
      # (openvibe-contracts tag v0.27.0).
      - run: npx openvibe-contracts-check --service codes --src server
