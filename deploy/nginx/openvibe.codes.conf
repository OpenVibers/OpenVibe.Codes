## ═══════════════════════════════════════════════════════════════
## openvibe.codes — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.codes.conf — keep them in sync and reload nginx
## after changing it. The Node app (port 4900, systemd unit openvibe-codes) renders every page and answers
## the developer console's former addresses with permanent redirects to openvibe.services; nginx terminates
## TLS, redirects www → apex, rate-limits sign-in, the old form addresses and the API, and compresses text.
##
## No proxy_cache: the app decides cacheability per response (public for the pages rendered for anonymous
## visitors; private, no-store for everything personal). Never log request bodies here.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ovcodes_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ovcodes_forms:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=ovcodes_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.codes www.openvibe.codes;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.codes$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.codes;

    ssl_certificate     /etc/letsencrypt/live/openvibe.codes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.codes/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.codes$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.codes;
    include snippets/security-txt.conf;   # /.well-known/security.txt (the host's file)

    ssl_certificate     /etc/letsencrypt/live/openvibe.codes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.codes/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.codes.access.log;
    error_log  /var/log/nginx/openvibe.codes.error.log;

    # Playground uploads are at most 1 MB (CODES_PLAYGROUND_MAX_UPLOAD_BYTES); forms are small.
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json application/schema+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints (strict) ──────────────
    # The session probe: the shared navbar asks it on every page view, so it cannot share the sign-in
    # budget below (10 a minute): a visitor reading quickly was answered 503 and looked signed out
    # (found by the browser check, OpenVibe.Host scripts/browser-check.js).
    location = /auth/me {
        limit_req zone=ovcodes_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4900;
    }

    location /auth/ {
        limit_req zone=ovcodes_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4900;
    }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=ovcodes_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:4900;
    }

    # ── The developer console's former form addresses (now 308s to openvibe.services) ──
    location ~ ^/(projects|releases|tools|manifests|staff) {
        limit_req zone=ovcodes_forms burst=20 nodelay;
        proxy_pass http://127.0.0.1:4900;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:4900/metrics) ──
    location ~* ^/metrics(/|$) { return 404; }
    # OpenVibe.Events delivers to 127.0.0.1 directly; nothing from outside reaches /internal/.
    location /internal/ { return 404; }

    # ── OpenVibe Git: Forgejo (deploy/forgejo), its ROOT_URL is https://openvibe.codes/git/ ──
    # ^~ so the dotfile rule below never hides a repository path like /git/OpenVibers/x/src/branch/main/.github/.
    # Pushes and clones are streamed (no buffering), up to 512 MB a request (Cloudflare's own limit is lower).
    location = /git { return 301 /git/; }
    location ^~ /git/ {
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:5060/;
    }

    # ── Pages, docs, robots.txt, sitemap, static assets ─────
    location / {
        proxy_pass http://127.0.0.1:4900;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
